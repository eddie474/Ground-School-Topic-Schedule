<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ground School Topics</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      --blue:#0066ff;
      --blue-deep:#082a66;
      --blue-dark:#071f4d;
      --blue-soft:#eef6ff;
      --blueDeep:var(--blue-deep);
      --blueSoft:var(--blue-soft);
      --yellow:#facc15;
      --yellowSoft:#fff9dc;
      --ink:#0b1736;
      --muted:#5f6f8f;
      --line:#dbe8f8;
      --panel:rgba(255,255,255,.94);
      --cardBg:#ffffff;
    }

    *{ box-sizing:border-box; }

    html,body{margin:0;min-height:100%;}

    body{
      background:
        radial-gradient(circle at 8% 2%, rgba(0,102,255,.09), transparent 28%),
        radial-gradient(circle at 96% 12%, rgba(250,204,21,.10), transparent 24%),
        radial-gradient(circle at 78% 78%, rgba(0,102,255,.07), transparent 28%),
        linear-gradient(180deg,#ffffff 0%,#f7fbff 58%,#ffffff 100%);
    }

    .page-shell{
      position:relative;
      width:calc(100% - 100px);
      height:calc(100vh - 44px);
      margin:22px 50px;
      display:grid;
      grid-template-rows:clamp(88px,10vh,125px) clamp(124px,12vh,140px) minmax(0,1fr);
      overflow:hidden;
      background:var(--panel);
      border:1px solid rgba(0,102,255,.13);
      border-radius:22px;
      box-shadow:0 14px 36px rgba(20,47,91,.10);
    }

    .sky-wash{
      background:
        radial-gradient(circle at 18% 38%, rgba(96,165,250,.10), transparent 25%),
        radial-gradient(circle at 78% 78%, rgba(0,102,255,.07), transparent 28%);
      animation:skyBreathe 10s ease-in-out infinite;
    }

    .glass-card{
      background:var(--panel);
      border:1px solid rgba(0,102,255,.13);
      box-shadow:0 14px 36px rgba(20,47,91,.10);
      backdrop-filter:blur(12px);
    }

    .header-panel{
      height:100%;
      padding:12px 24px;
      background:transparent;
      border-bottom:1px solid var(--line);
    }

    .header-grid{
      display:grid;
      grid-template-columns:minmax(180px,1fr) auto minmax(180px,1fr);
      align-items:center;
      gap:1rem;
      height:100%;
    }

    .brand-logo{
      width:clamp(122px,14vh,160px);
      height:clamp(122px,14vh,160px);
      max-width:none;
      object-fit:contain;
      transform:translateY(-24%);
      filter:drop-shadow(0 8px 14px rgba(15,23,42,.10));
    }

    .header-logo-wrap{display:flex;justify-content:center;align-items:flex-start;width:200px;height:clamp(58px,7vh,76px);justify-self:end;overflow:hidden;}
    .brand-logo-fallback{
      display:flex;
      align-items:center;
      gap:9px;
      color:var(--blueDeep);
      font-weight:950;
      line-height:1;
      text-align:left;
    }
    .brand-logo-fallback[hidden]{display:none;}
    .brand-logo-mark{
      display:grid;
      place-items:center;
      width:48px;
      height:48px;
      flex:none;
      border-radius:50%;
      background:linear-gradient(145deg,var(--blue),var(--blue-dark));
      color:var(--yellow);
      font-size:1.05rem;
      letter-spacing:-.05em;
      box-shadow:0 7px 16px rgba(0,102,255,.2);
    }
    .brand-logo-name{display:block;font-size:.76rem;letter-spacing:.04em;text-transform:uppercase;}
    .brand-logo-name span{display:block;margin-top:3px;color:var(--blue);font-size:.62rem;letter-spacing:.12em;}

    .headline-pop{
      color:var(--blueDeep);
      font-size:clamp(1.55rem,2.25vw,2.15rem);
      font-weight:700;
      letter-spacing:-.03em;
    }

    .header-title-wrap{position:relative;}

    .headline-rule{
      position:absolute;
      top:calc(100% + .65rem);
      left:50%;
      transform:translateX(-50%);
      width:min(280px,70vw);
      height:2px;
      margin:0;
      border-radius:999px;
      background:linear-gradient(90deg,transparent,var(--blue),var(--yellow),transparent);
    }

    .today-badge{
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      border:1px solid rgba(0,102,255,.14);
      border-radius:14px;
      background:#fff;
      box-shadow:0 6px 18px rgba(20,47,91,.07);
      padding:.55rem .8rem;
      color:var(--blueDeep);
      font-size:.86rem;
      font-weight:800;
    }
    .header-left{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
      justify-self:start;
    }

    .countdown-shell{
      position:relative;
      overflow:hidden;
      width:100%;
      height:100%;
      min-height:0;
      display:flex;
      align-items:center;
      padding:10px 20px;
      background:linear-gradient(110deg,#0066ff 0%,#083d91 48%,#071f4d 100%);
      color:white;
    }
    .countdown-shell > div{
      position:relative;
      z-index:10;
      width:100%;
      height:100%;
      display:grid;
      grid-template-columns:minmax(350px,.9fr) minmax(0,3.1fr);
      grid-template-rows:minmax(0,1fr);
      align-items:center;
      gap:16px;
    }

    .countdown-shell::after{
      content:"";
      position:absolute;
      width:220px;height:220px;
      right:-60px;top:-100px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(250,204,21,.34),transparent 64%);
      pointer-events:none;
    }

    .countdown-label{
      text-transform:uppercase;
      letter-spacing:.14em;
      font-size:.7rem;
      font-weight:800;
      color:rgba(255,255,255,.68);
    }

    .countdown-time{
      font-variant-numeric:tabular-nums;
      letter-spacing:-.03em;
    }

    .countdown-summary{min-width:0;overflow:visible;}
    .countdown-main{margin-top:4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;}
    #countdownClass,#countdownClock{font-size:clamp(1.2rem,1.65vw,1.55rem);font-weight:850;line-height:1.08;}
    #countdownClock{color:var(--yellow)!important;}
    #countdownSub{margin-top:3px!important;font-size:.76rem;line-height:1.2;color:rgba(255,255,255,.72);white-space:normal;}

    .status-dot{
      width:10px;height:10px;border-radius:999px;
      background:var(--yellow);
      box-shadow:0 0 0 5px rgba(250,204,21,.16);
      display:inline-block;
    }

    .today-strip{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:9px;
    }

    .session-chip{
      display:flex;
      flex-direction:column;
      justify-content:center;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.08);
      border-radius:12px;
      padding:8px 11px;
      min-width:0;
    }
    .session-chip strong{display:block;color:#fff;font-size:clamp(.72rem,.84vw,.88rem);line-height:1.15;white-space:normal;overflow:visible;}
    .session-chip span{margin-top:4px;font-size:clamp(.56rem,.64vw,.66rem);line-height:1.15;color:rgba(255,255,255,.72);white-space:nowrap;}
    .session-chip.active{background:rgba(250,204,21,.14);border-color:rgba(250,204,21,.46);}
    .session-chip.next{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.30);}
    .session-chip.off{opacity:.42;}

    .flight-trail{
      position:absolute;
      left:-12%; width:64%; height:2px; border-radius:999px;
      background:linear-gradient(90deg,transparent,rgba(0,102,255,.08),rgba(0,102,255,.42),rgba(250,204,21,.28),transparent);
      transform:rotate(-12deg); opacity:.55; animation:trailSweep 8s linear infinite;
    }
    .flight-trail:nth-child(1){top:22%;animation-delay:-1s;}
    .flight-trail:nth-child(2){top:42%;animation-delay:-4s;width:48%;opacity:.34;}
    .flight-trail:nth-child(3){top:69%;animation-delay:-2.5s;width:58%;opacity:.26;}

    .card{
      position:relative;
      overflow:hidden;
      min-width:0;
      min-height:0;
      display:flex;
      flex-direction:column;
      padding:clamp(20px,1.65vw,34px);
      background:rgba(255,255,255,.72);
      border:0;
      border-right:1px solid var(--line);
      animation:cardRise .6s ease both;
    }
    .card:last-child{border-right:0;}
    .card:nth-child(1){animation-delay:.05s}.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.19s}.card:nth-child(4){animation-delay:.26s}.card:nth-child(5){animation-delay:.33s}

    .course-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;}
    .course-title{color:var(--ink);font-size:1.18rem;font-weight:850;line-height:1.2;}
    .course-time{
      flex:none;
      background:var(--blueSoft);
      color:var(--blue);
      border:1px solid rgba(0,102,255,.12);
      border-radius:999px;
      padding:.35rem .62rem;
      font-weight:850;
      font-size:.78rem;
      white-space:nowrap;
    }

    .meta-row{display:flex;flex-wrap:wrap;gap:.4rem .8rem;color:var(--muted);font-size:.72rem;margin-top:.7rem;}
    .meta-item{display:inline-flex;align-items:center;gap:.3rem;}
    .meta-dot{width:5px;height:5px;border-radius:99px;background:var(--yellow);}

    .today-topic{
      margin-top:1rem;
      display:grid;
      grid-template-columns:5px 1fr;
      gap:.8rem;
      align-items:stretch;
      background:linear-gradient(90deg,var(--blueSoft),#fff);
      border:1px solid rgba(0,102,255,.10);
      border-radius:14px;
      padding:.8rem .9rem;
    }
    .today-topic::before{content:"";border-radius:99px;background:linear-gradient(180deg,var(--yellow),var(--blue));}
    .today-topic-label{text-transform:uppercase;letter-spacing:.12em;font-size:.63rem;font-weight:800;color:var(--muted);}
    .today-topic-name{margin-top:.18rem;font-size:1rem;font-weight:800;color:var(--blueDeep);}

    .upcoming-box{
      margin-top:1rem;
      min-height:0;
      flex:1;
      display:flex;
      flex-direction:column;
      background:#fbfdff;
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
    }
    .upcoming-head{
      display:flex;align-items:center;justify-content:space-between;
      padding:.7rem .8rem;
      background:linear-gradient(90deg,#f4f9ff,#fffdf2);
      border-bottom:1px solid var(--line);
    }
    .upcoming-title{text-transform:uppercase;letter-spacing:.11em;font-size:.66rem;font-weight:850;color:var(--blueDeep);}
    .upcoming-count{font-size:.66rem;color:var(--muted);}
    .session-row{
      display:grid;
      grid-template-columns:116px 1fr;
      gap:.75rem;
      min-height:0;
      flex:1;
      align-items:center;
      padding:.62rem .8rem;
      border-bottom:1px solid #edf3fb;
    }
    .session-row:last-child{border-bottom:0;}
    .session-date{font-size:.70rem;color:var(--muted);font-variant-numeric:tabular-nums;}
    .session-topic{font-size:.82rem;color:var(--ink);font-weight:650;}

    .standdown-overlay{
      position:fixed;
      inset:0;
      z-index:100;
      display:none;
      align-items:center;
      overflow:hidden;
      pointer-events:none;
      background:rgba(4,18,48,.78);
      backdrop-filter:blur(8px) saturate(.75);
    }
    .standdown-overlay.active{display:flex;}
    .standdown-panel{
      width:100%;
      padding:clamp(28px,4vh,64px) 0;
      overflow:hidden;
      color:#fff;
      text-align:center;
      background:linear-gradient(100deg,#071f4d,#0066ff 52%,#082a66);
      border-block:clamp(5px,.5vw,10px) solid var(--yellow);
      box-shadow:0 28px 90px rgba(0,0,0,.42);
    }
    .standdown-kicker{
      margin-bottom:clamp(12px,1.5vh,22px);
      padding-inline:1rem;
      color:#dbeafe;
      font-size:clamp(14px,1.15vw,25px);
      font-weight:850;
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    .standdown-marquee{overflow:hidden;}
    .standdown-track{
      display:flex;
      width:max-content;
      animation:standdownAcross 13s linear infinite;
      will-change:transform;
    }
    .standdown-message{
      display:block;
      padding-right:10vw;
      color:#fff;
      font-size:clamp(58px,8vw,180px);
      font-weight:950;
      line-height:.95;
      letter-spacing:-.045em;
      white-space:nowrap;
      text-shadow:0 8px 28px rgba(0,0,0,.3);
    }
    .standdown-message::before{
      content:"•";
      margin-right:4vw;
      color:var(--yellow);
    }
    .standdown-timer{
      margin-top:clamp(16px,2vh,28px);
      color:var(--yellow);
      font-size:clamp(18px,1.65vw,34px);
      font-weight:900;
      font-variant-numeric:tabular-nums;
    }
    .standdown-toggle{
      position:static;
      z-index:auto;
      display:flex;
      align-items:center;
      gap:.4rem;
      padding:.4rem .52rem;
      border:1px solid rgba(0,102,255,.18);
      border-radius:10px;
      background:rgba(255,255,255,.96);
      box-shadow:0 4px 12px rgba(20,47,91,.10);
      color:var(--blueDeep);
      font-size:.63rem;
      font-weight:800;
      line-height:1;
      white-space:nowrap;
      cursor:pointer;
    }
    .standdown-toggle-track{
      position:relative;
      width:30px;
      height:17px;
      flex:none;
      border-radius:999px;
      background:#cbd5e1;
      transition:background .2s ease;
    }
    .standdown-toggle-track::after{
      content:"";
      position:absolute;
      top:2px;
      left:2px;
      width:13px;
      height:13px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 2px 6px rgba(15,23,42,.24);
      transition:transform .2s ease;
    }
    .standdown-toggle[aria-checked="true"] .standdown-toggle-track{background:var(--blue);}
    .standdown-toggle[aria-checked="true"] .standdown-toggle-track::after{transform:translateX(13px);}

    .c172-flyby{
      position:fixed;
      left:calc(100vw - 150px);
      top:calc(100vh - 70px);
      z-index:20;
      width:clamp(120px,14vw,220px);
      pointer-events:none;
      opacity:.82;
      transform:translate(-13%,-47%) rotate(0deg);
      transform-origin:13% 47%;
      transition:opacity .2s ease;
      will-change:left,top,transform;
    }
    .c172-flyby.is-tracking{opacity:.96;}
    .c172-plane{
      display:block;
      width:100%;
      height:auto;
      transform:scaleX(1);
      transform-origin:13% 47%;
      filter:drop-shadow(0 10px 15px rgba(15,23,42,.18));
    }
    .mono{font-variant-numeric:tabular-nums;}

    .page-header{position:relative;z-index:10;min-width:0;}
    .summary-section{position:relative;z-index:10;min-width:0;min-height:0;}
    .topics-grid{
      position:relative;
      z-index:10;
      min-width:0;
      min-height:0;
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      overflow:hidden;
      border-top:1px solid var(--line);
    }

    .schedule-section{
      position:relative;
      z-index:10;
      min-width:0;
      min-height:0;
      padding:clamp(12px,1.4vw,22px);
      overflow:hidden;
      border-top:1px solid var(--line);
      background:rgba(247,251,255,.62);
    }
    .schedule-wrap{
      width:100%;
      height:100%;
      min-height:0;
      overflow:auto;
      border:1px solid rgba(0,102,255,.15);
      border-radius:18px;
      background:#fff;
      box-shadow:0 12px 28px rgba(20,47,91,.08);
    }
    .schedule-grid{
      display:grid;
      grid-template-columns:minmax(205px,.92fr) repeat(4,minmax(175px,1fr));
      grid-template-rows:minmax(62px,.72fr) repeat(5,minmax(62px,1fr));
      column-gap:10px;
      width:100%;
      min-width:960px;
      height:100%;
      background:#e7eef8;
    }
    .schedule-row{display:contents;}
    .schedule-grid > .schedule-row > *{
      min-width:0;
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
    }
    .schedule-grid > .schedule-row > *:last-child{border-right:0;}
    .schedule-grid > .schedule-row:last-child > *{border-bottom:0;}
    .schedule-corner,
    .schedule-date{
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:13px 16px;
      background:linear-gradient(135deg,#f2f8ff,#fffdf3);
    }
    .schedule-corner{
      position:sticky;
      left:0;
      z-index:4;
      color:var(--muted);
      font-size:.68rem;
      font-weight:850;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .schedule-corner strong{
      margin-top:2px;
      color:var(--blueDeep);
      font-size:1.08rem;
      letter-spacing:-.02em;
      text-transform:none;
    }
    .schedule-date{align-items:center;text-align:center;}
    .schedule-date.today-column{
      position:relative;
      border-top:4px solid var(--blue);
      border-right:2px solid var(--blue)!important;
      border-left:2px solid var(--blue);
      background:linear-gradient(145deg,#cfe5ff,#fff1a8);
      box-shadow:0 7px 18px rgba(0,102,255,.14);
    }
    .schedule-day{
      color:var(--blueDeep);
      font-size:.82rem;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.1em;
    }
    .schedule-date-value{margin-top:3px;color:var(--muted);font-size:.76rem;font-weight:750;}
    .schedule-today{
      margin-top:5px;
      padding:3px 8px;
      border-radius:999px;
      background:var(--blue);
      color:#fff;
      font-size:.62rem;
      font-weight:900;
      letter-spacing:.11em;
      text-transform:uppercase;
    }
    .schedule-course{
      position:sticky;
      left:0;
      z-index:3;
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:13px 16px;
      background:#fff;
      box-shadow:7px 0 15px rgba(20,47,91,.035);
    }
    .schedule-course strong{color:var(--ink);font-size:1rem;font-weight:900;line-height:1.18;}
    .schedule-course-time{margin-top:5px;color:var(--blue);font-size:.72rem;font-weight:850;}
    .schedule-course-days{margin-top:3px;color:var(--muted);font-size:.64rem;}
    .schedule-cell{
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:13px 16px;
      background:#fff;
    }
    .schedule-cell.today-column{
      border-right:2px solid var(--blue)!important;
      border-left:2px solid var(--blue);
      background:linear-gradient(90deg,#edf6ff,#fffdf0);
      box-shadow:0 6px 15px rgba(0,102,255,.06);
    }
    .schedule-row:last-child .schedule-cell.today-column{border-bottom:4px solid var(--blue);}
    .schedule-cell.off{background:#f8fafc;color:#9aa8bd;}
    .schedule-cell-kicker{
      margin-bottom:5px;
      color:var(--blue);
      font-size:.6rem;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .schedule-cell-topic{color:var(--ink);font-size:.84rem;font-weight:760;line-height:1.28;}
    .schedule-cell-off{font-size:.72rem;font-weight:750;}

    @media(max-width:820px){
      body{overflow:auto;}
      .page-shell{
        width:100%;
        height:auto;
        min-height:100vh;
        margin:0;
        display:block;
        overflow:hidden;
        border-radius:0;
      }
      .page-header{min-height:105px;}
      .header-panel{padding:18px 16px;}
      .header-grid{grid-template-columns:1fr;justify-items:center;text-align:center;}
      .header-left{justify-self:center;}
      .header-logo-wrap{justify-content:center;}
      .today-strip{grid-template-columns:repeat(2,minmax(0,1fr));}
      .summary-section{min-height:150px;}
      .countdown-shell{height:auto;min-height:150px;}
      .countdown-shell > div{display:grid;grid-template-columns:1fr;height:auto;}
      .topics-grid{grid-template-columns:1fr;overflow:visible;}
      .schedule-section{padding:10px;overflow:visible;}
      .schedule-wrap{height:auto;min-height:0;border-radius:14px;}
      .schedule-grid{height:620px;}
      .card{border-right:0;border-bottom:1px solid var(--line);}
      .card:last-child{border-bottom:0;}
    }
    @media(max-width:520px){
      .today-strip{grid-template-columns:1fr 1fr;}
      .course-head{display:block;}
      .course-time{display:inline-block;margin-top:.45rem;}
      .session-row{grid-template-columns:1fr;gap:.15rem;}
    }
    @media(min-width:1800px){
      .course-title{font-size:1.7rem;}
      .course-time{font-size:1.05rem;padding:.5rem .84rem;}
      .meta-row{font-size:.95rem;}
      .today-topic-label{font-size:.8rem;}
      .today-topic-name{font-size:1.35rem;}
      .upcoming-title,.upcoming-count{font-size:.84rem;}
      .session-date{font-size:.95rem;}
      .session-topic{font-size:1.12rem;}
    }
    @media(min-width:821px) and (max-width:1199px){
      body{overflow:auto;}
      .page-shell{
        width:calc(100% - 32px);
        height:auto;
        min-height:calc(100vh - 32px);
        margin:16px;
        display:grid;
        grid-template-rows:clamp(92px,11vh,125px) clamp(130px,15vh,150px) auto;
      }
      .topics-grid{grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;}
      .schedule-section{overflow:visible;}
      .schedule-wrap{height:650px;}
      .card{border-bottom:1px solid var(--line);}
      .card:nth-child(2n){border-right:0;}
      .card:last-child{grid-column:1 / -1;border-right:0;border-bottom:0;}
    }
    @media(min-width:821px) and (max-width:1100px){

<script>
/* =========================================
   EDIT TOPICS HERE
   Days: 0=Sun ... 6=Sat
   ========================================= */

const SCHEDULE = {
  StageCheck: {
    days: [2,4,6], // Tue/Thu/Sat
    fixedTopic: "Stage Check Ground"
  },

  Private: {
    days: [0,1,2,3,4,5,6],
    topics: [
      "Student Pilot Documents",
      "Aircraft Documents-Inspections",
      "Preflight Aircraft Inspection",
      "Checklist Usage Sterile Cockpit",
      "Passenger Safety Briefing",
      "Primary Flight Controls",
      "Secondary Flight Controls",
      "Powerplant Engines",
      "Ignition Magneto",
      "Fuel System",
      "Electrical System",
      "Landing Gear Brakes Pressurization Oxygen",
      "Runway Incursions",
      "Radio Communications - Cockpit Management",
      "Lift Turns",
      "Drag Ground Effect",
      "Wake Turbulence",
      "Stalls and Spins",
      "Weight and Balance",
      "Thrust Propeller",
      "Density Altitude",
      "Airplane Performance",
      "Pitot-Static Flight Instruments",
      "Gyroscopic Flight Instruments",
      "Taxi Procedures",
      "Airspace Classifications",
      "Collision Avoidance",
      "Forced Landing",
      "Night Operations",
      "Inoperative Equipment",
      "Maneuvering Speed"
    ]
  },

  Instrument: {
    days: [2,3,4,5,6], // Tue-Sat
    topics: [
      "Spatial Disorientation",
      "Attitude Instrument Flying EFD",
      "Flying Partial Panel",
      "Preparing for the Approach",
      "Alternate Airports",
      "VORs How It Works",
      "VOR Tracking",
      "GPS How It Works",
      "GPS Approaches",
      "Holding Patterns",
      "ILS Approaches",
      "Circling to Land"
    ]
  },

  Commercial: {
    days: [2,4,6], // Tue/Thu/Sat
    topics: [
      "Privileges and Limitations, Commercial Regulations",
      "MELs, Getting an MEL, Ferry Permits",
      "High Altitude Systems",
      "Constant Speed Props and Propeller Principals, Turbines",
      "Control Surfaces and Their Varieties",
      "L/D Coefficient, Range and Endurance",
      "Stalls and Spins, T-tails and Deep Stalls",
      "Effects of Wing Planform and Wing Design",
      "Critical Mach Number, Mach Tuck, Transonic Aerodynamics",
      "CG, Stability, Weight Shift Formula",
      "Traversing Complex Airspace",
      "Risk Management and ADM In Commercial Operations"
    ]
  },

  Written: {
    days: [2,3,4,5,6], // Tue/Wed/Thu/Fri/Sat
    trackByDay: {
      2: "PVT",
      3: "IRA",
      4: "PVT",
      5: "IRA",
      6: "PVT"
    },
    topics: {
      PVT: ["PVT Knowledge Test Prep"],
      IRA: ["IRA Knowledge Test Prep"]
    }
  }
};

/* =========================================
   TOPIC 1 START DATES
   These make 3/17/2026 line up as:
   Private = Runway Incursions
   Instrument = Holding Patterns
   Commercial = High Altitude Systems
   ========================================= */

const START_DATES = {
  Private: "2026-03-05",
  Instrument: "2026-02-27",
  Commercial: "2026-03-12",
  Written: "2026-03-17"
};

const CLASS_TIMES = [
  { key: "StageCheck", label: "Stage Check Ground", short: "Stage Check Ground", start: "08:30", end: "10:30" },
  { key: "Instrument", label: "Instrument Rating", rowLabel: "IRA", short: "Instrument", start: "10:30", end: "12:30" },
  { key: "Written", label: "Knowledge Test Prep", short: "Knowledge Prep", start: "13:00", end: "14:00" },
  { key: "Private", label: "Private", short: "Private", start: "14:00", end: "16:00" },
  { key: "Commercial", label: "Commercial", short: "Commercial", start: "16:00", end: "18:00" }
];

/* =========================================
   ENGINE
   ========================================= */

const weekdays = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const pad2 = (n) => String(n).padStart(2, "0");

function toYMD(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function parseYMD(ymd) {
  const [y, m, d] = ymd.split("-").map(Number);
  return new Date(y, m - 1, d, 0, 0, 0, 0);
}

function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}

function isMeetingDay(days, dateObj) {
  return days.includes(dateObj.getDay());
}

function countMeetingsInclusive(anchor, target, days) {
  if (target < anchor) return 0;

  let count = 0;
  let d = new Date(anchor);

  while (d <= target) {
    if (isMeetingDay(days, d)) count++;
    d = addDays(d, 1);
  }

  return count;
}

function topicForDate(startDate, dateObj, rating) {
  if (!isMeetingDay(rating.days, dateObj)) return null;
  if (rating.fixedTopic) return rating.fixedTopic;

  if (rating.trackByDay && rating.topics && !Array.isArray(rating.topics)) {
    const day = dateObj.getDay();
    const track = rating.trackByDay[day];
    const list = rating.topics[track] || [];
    if (!list.length) return null;

    const n = countMeetingsInclusive(startDate, dateObj, rating.days);
    if (n <= 0) return null;

    return list[(n - 1) % list.length];
  }

  const n = countMeetingsInclusive(startDate, dateObj, rating.days);
  const list = rating.topics || [];

  if (!list.length || n <= 0) return null;
  return list[(n - 1) % list.length];
}

function nextMeetings(fromDate, rating, howMany = 4) {
  const out = [];
  let d = new Date(fromDate);

  for (let i = 0; i < 42 && out.length < howMany; i++) {
    if (isMeetingDay(rating.days, d)) out.push(new Date(d));
    d = addDays(d, 1);
  }

  return out;
}

function meetsLabel(days) {
  return days.map(d => weekdays[d].slice(0, 3)).join(", ");
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// Auto refresh every 2 hours (2 * 60 * 60 * 1000 ms)
setInterval(() => {
  location.reload();
}, 7200000);
/* =========================================
   UI
   ========================================= */

function pillForToday(rating, today) {
  if (isMeetingDay(rating.days, today)) {
    return `<span class="pill pill-ok text-xs px-3 py-1 rounded-full">Meets today</span>`;
  }
  return `<span class="pill text-xs px-3 py-1 rounded-full">No class today</span>`;
}

function renderCard(elId, title, timeLabel, rating, today, startDateYMD) {
  const el = document.getElementById(elId);
  const startDate = startDateYMD ? parseYMD(startDateYMD) : null;
  const todayTopic = topicForDate(startDate, today, rating);

  const upcomingDates = nextMeetings(addDays(today, 1), rating, 4);
  const upcomingLines = upcomingDates.map(d => {
    const t = topicForDate(startDate, d, rating);
    return `
      <div class="session-row">
        <div class="session-date">${weekdays[d.getDay()].slice(0,3)} • ${toYMD(d)}</div>
        <div class="session-topic">${escapeHtml(t || "—")}</div>
      </div>
    `;
  }).join("");

  el.innerHTML = `
    <div class="course-head">
      <div class="course-title">${escapeHtml(title)}</div>
      <div class="course-time">${escapeHtml(timeLabel)}</div>
    </div>

    <div class="meta-row">
      <span class="meta-item"><span class="meta-dot"></span>Meets ${escapeHtml(meetsLabel(rating.days))}</span>
      ${startDateYMD ? `<span class="meta-item">Topic 1 • <span class="mono">${escapeHtml(startDateYMD)}</span></span>` : ""}
    </div>

    <div class="today-topic">
      <div>
        <div class="today-topic-label">Today</div>
        ${isMeetingDay(rating.days, today)
          ? `<div class="today-topic-name">${escapeHtml(todayTopic || "—")}</div>`
          : `<div class="today-topic-name" style="color:var(--muted)">No scheduled session</div>`}
      </div>
    </div>

    <div class="upcoming-box">
      <div class="upcoming-head">
        <div class="upcoming-title">Next sessions</div>
        <div class="upcoming-count">4 upcoming</div>
      </div>
      ${upcomingLines || `<div class="p-3 text-sm" style="color:var(--muted)">No upcoming sessions found.</div>`}
    </div>
  `;
}

function isSameDate(a, b) {
  return toYMD(a) === toYMD(b);
}

function renderSchedule(today) {
  const grid = document.getElementById("scheduleGrid");
  const dates = Array.from({ length: 4 }, (_, index) => addDays(today, index));

  const header = `
    <div class="schedule-row" role="row">
      <div class="schedule-corner" role="columnheader">
        <span>Ground school</span>
        <strong>Class schedule</strong>
      </div>
      ${dates.map(date => {
        const todayClass = isSameDate(date, today) ? " today-column" : "";
        return `
          <div class="schedule-date${todayClass}" role="columnheader">
            <span class="schedule-day">${escapeHtml(weekdays[date.getDay()])}</span>
            <span class="schedule-date-value">${escapeHtml(date.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }))}</span>
            ${todayClass ? `<span class="schedule-today">Today</span>` : ""}
          </div>
        `;
      }).join("")}
    </div>
  `;

  const rows = CLASS_TIMES.map(item => {
    const rating = SCHEDULE[item.key];
    const startDateYMD = START_DATES[item.key];
    const startDate = startDateYMD ? parseYMD(startDateYMD) : null;
    const cells = dates.map(date => {
      const meeting = isMeetingDay(rating.days, date);
      const topic = meeting ? topicForDate(startDate, date, rating) : null;
      const todayClass = isSameDate(date, today) ? " today-column" : "";

      return meeting
        ? `<div class="schedule-cell${todayClass}" role="cell">
             <span class="schedule-cell-kicker">Topic</span>
             <strong class="schedule-cell-topic">${escapeHtml(topic || "To be announced")}</strong>
           </div>`
        : `<div class="schedule-cell off${todayClass}" role="cell">
             <span class="schedule-cell-off">No class</span>
           </div>`;
    }).join("");

    return `
      <div class="schedule-row" role="row">
        <div class="schedule-course" role="rowheader">
          <strong>${escapeHtml(item.rowLabel || item.label)}</strong>
          <span class="schedule-course-time">${escapeHtml(formatClockTime(item.start))}–${escapeHtml(formatClockTime(item.end))}</span>
          <span class="schedule-course-days">${escapeHtml(meetsLabel(rating.days))}</span>
        </div>
        ${cells}
      </div>
    `;
  }).join("");

  grid.innerHTML = header + rows;
}

function timeOnDate(dateObj, hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const d = new Date(dateObj);
  d.setHours(h, m, 0, 0);
  return d;
}

function formatClockTime(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const suffix = h >= 12 ? "PM" : "AM";
  const hour = h % 12 || 12;
  return `${hour}:${pad2(m)} ${suffix}`;
}

function formatDuration(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const hours = Math.floor(total / 3600);
  const mins = Math.floor((total % 3600) / 60);
  const secs = total % 60;
  if (hours > 0) return `${hours}h ${pad2(mins)}m ${pad2(secs)}s`;
  return `${mins}m ${pad2(secs)}s`;
}

let standdownOverride = null;

function updateStanddown(now = new Date()) {
  const overlay = document.getElementById("standdownOverlay");
  const timer = document.getElementById("standdownTimer");
  const toggle = document.getElementById("standdownToggle");
  const starts = timeOnDate(now, "12:30");
  const ends = timeOnDate(now, "13:00");
  const scheduledActive = now >= starts && now < ends;
  const active = standdownOverride ?? scheduledActive;

  overlay.classList.toggle("active", active);
  overlay.setAttribute("aria-hidden", String(!active));
  toggle.setAttribute("aria-checked", String(active));

  if (active) {
    timer.textContent = scheduledActive
      ? `${formatDuration(ends - now)} remaining • Classes resume at 1:00 PM`
      : "Instructor standdown enabled manually";
  }
}

document.getElementById("standdownToggle").addEventListener("click", (event) => {
  standdownOverride = event.currentTarget.getAttribute("aria-checked") !== "true";
  updateStanddown();
});

function initCursorPlane() {
  const plane = document.getElementById("cursorPlane");
  const planeImage = document.getElementById("cursorPlaneImage");
  if (!plane || !planeImage || typeof window === "undefined") return;

  let currentX = Math.max(80, window.innerWidth - 150);
  let currentY = Math.max(60, window.innerHeight - 70);
  let targetX = currentX;
  let targetY = currentY;
  let rotation = 0;
  let targetRotation = 0;
  let facingRight = false;
  let tracking = false;

  const setTracking = (active) => {
    tracking = active;
    plane.classList.toggle("is-tracking", active);
  };

  document.addEventListener("pointermove", (event) => {
    if (event.pointerType && event.pointerType !== "mouse" && event.pointerType !== "pen") return;
    targetX = event.clientX;
    targetY = event.clientY;
    setTracking(true);
  }, { passive: true });

  document.documentElement.addEventListener("mouseleave", () => setTracking(false));
  window.addEventListener("blur", () => setTracking(false));

  function animatePlane() {
    if (tracking) {
      const dx = targetX - currentX;
      const dy = targetY - currentY;
      const distance = Math.hypot(dx, dy);

      if (distance > 0.5) {
        const heading = Math.atan2(dy, dx) * 180 / Math.PI;
        const nextFacingRight = dx >= 0;

        // Mirror around the nose when changing direction so the artwork stays upright.
        targetRotation = nextFacingRight
          ? heading
          : ((heading - 180 + 540) % 360) - 180;

        if (nextFacingRight !== facingRight) {
          facingRight = nextFacingRight;
          rotation = targetRotation;
          planeImage.style.transform = `scaleX(${facingRight ? -1 : 1})`;
        }
      }

      currentX += dx * 0.12;
      currentY += dy * 0.12;

      const angleDelta = ((targetRotation - rotation + 540) % 360) - 180;
      rotation += angleDelta * 0.18;
    }

    plane.style.left = `${currentX}px`;
    plane.style.top = `${currentY}px`;
    plane.style.transform = `translate(-13%, -47%) rotate(${rotation}deg)`;
    window.requestAnimationFrame(animatePlane);
  }

  window.requestAnimationFrame(animatePlane);
}

function updateCountdown() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const sessions = CLASS_TIMES.map(item => ({
    ...item,
    rating: SCHEDULE[item.key],
    starts: timeOnDate(today, item.start),
    ends: timeOnDate(today, item.end)
  }));

  const meetingSessions = sessions.filter(s => isMeetingDay(s.rating.days, today));
  const active = meetingSessions.find(s => now >= s.starts && now < s.ends);
  const next = meetingSessions.find(s => now < s.starts);

  const eyebrow = document.getElementById("countdownEyebrow");
  const className = document.getElementById("countdownClass");
  const clock = document.getElementById("countdownClock");
  const sub = document.getElementById("countdownSub");
  const dot = document.getElementById("countdownDot");

  if (active) {
    eyebrow.textContent = "In session now";
    className.textContent = active.label;
    clock.textContent = `${formatDuration(active.ends - now)} left`;
    sub.textContent = `${formatClockTime(active.start)}–${formatClockTime(active.end)} • class is currently underway`;
    dot.style.background = "#22c55e";
    dot.style.boxShadow = "0 0 0 5px rgba(34,197,94,.16)";
  } else if (next) {
    eyebrow.textContent = "Next class today";
    className.textContent = next.label;
    clock.textContent = formatDuration(next.starts - now);
    sub.textContent = `Starts at ${formatClockTime(next.start)} • countdown updates live`;
    dot.style.background = "#facc15";
    dot.style.boxShadow = "0 0 0 5px rgba(250,204,21,.16)";
  } else if (meetingSessions.length) {
    eyebrow.textContent = "Today complete";
    className.textContent = "Ground school is finished for today";
    clock.textContent = "✓";
    sub.textContent = "All scheduled sessions for today have ended.";
    dot.style.background = "#93c5fd";
    dot.style.boxShadow = "0 0 0 5px rgba(147,197,253,.16)";
  } else {
    eyebrow.textContent = "No classes today";
    className.textContent = "No ground school sessions scheduled";
    clock.textContent = "—";
    sub.textContent = "Check the upcoming sessions below.";
  }

  const strip = document.getElementById("todayStrip");
  strip.innerHTML = sessions.map(s => {
    const meets = isMeetingDay(s.rating.days, today);
    let state = "";
    if (!meets) state = "off";
    else if (now >= s.starts && now < s.ends) state = "active";
    else if (!active && next && s.key === next.key) state = "next";

    return `
      <div class="session-chip ${state}">
        <strong>${escapeHtml(s.short)}</strong>
        <span>${meets ? `${formatClockTime(s.start)}–${formatClockTime(s.end)}` : "No class today"}</span>
      </div>
    `;
  }).join("");

  updateStanddown(now);
}

function render() {
  const today = new Date();
  document.getElementById("todayLine").textContent = `${weekdays[today.getDay()]} • ${toYMD(today)}`;

  renderSchedule(today);
  updateCountdown();
}

render();
initCursorPlane();
setInterval(updateCountdown, 1000);
</script>
