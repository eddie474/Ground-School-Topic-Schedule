<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ground School Topics</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      --blue:#0066ff;
      --blueDeep:#082a66;
      --blueSoft:#eef6ff;
      --yellow:#facc15;
      --yellowSoft:#fff9dc;
      --ink:#0b1736;
      --muted:#5f6f8f;
      --line:#dbe8f8;
      --panel:rgba(255,255,255,.94);
      --cardBg:#ffffff;
    }

    *{ box-sizing:border-box; }

    body{ background:#fff; }

    .page-shell{
      --shell-max:2320px;
      --shell-pad:clamp(16px,2vw,48px);
      min-height:100vh;
      padding:var(--shell-pad);
      background:
        radial-gradient(circle at 8% 2%, rgba(0,102,255,.09), transparent 28%),
        radial-gradient(circle at 96% 12%, rgba(250,204,21,.10), transparent 24%),
        linear-gradient(180deg,#ffffff 0%,#f7fbff 58%,#ffffff 100%);
    }

    .sky-wash{
      background:
        radial-gradient(circle at 18% 38%, rgba(96,165,250,.10), transparent 25%),
        radial-gradient(circle at 78% 78%, rgba(0,102,255,.07), transparent 28%);
      animation:skyBreathe 10s ease-in-out infinite;
    }

    .glass-card{
      background:var(--panel);
      border:1px solid rgba(0,102,255,.13);
      box-shadow:0 14px 36px rgba(20,47,91,.10);
      backdrop-filter:blur(12px);
    }

    .header-panel{
      background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(247,251,255,.94));
      border:1px solid rgba(0,102,255,.12);
      box-shadow:0 12px 34px rgba(20,47,91,.09);
    }

    .header-grid{
      display:grid;
      grid-template-columns:minmax(240px,1fr) auto minmax(240px,1fr);
      align-items:center;
      gap:1rem;
      min-height:88px;
    }

    .brand-logo{
      width:clamp(120px,12vw,260px);
      max-height:96px;
      object-fit:contain;
      filter:drop-shadow(0 8px 14px rgba(15,23,42,.10));
    }

    .header-logo-wrap{display:flex;justify-content:flex-end;}

    .headline-pop{
      color:var(--blueDeep);
    }

    .headline-rule{
      width:min(280px,70vw);
      height:3px;
      margin:.65rem auto 0;
      border-radius:999px;
      background:linear-gradient(90deg,transparent,var(--blue),var(--yellow),transparent);
    }

    .today-badge{
      display:inline-flex;
      align-items:center;
      gap:.5rem;
      border:1px solid rgba(0,102,255,.14);
      border-radius:14px;
      background:#fff;
      box-shadow:0 6px 18px rgba(20,47,91,.07);
      padding:.55rem .8rem;
      color:var(--blueDeep);
      font-weight:700;
    }

    .countdown-shell{
      position:relative;
      overflow:hidden;
      background:linear-gradient(110deg,#071f4d 0%,#083d91 48%,#0066ff 100%);
      border:1px solid rgba(0,102,255,.18);
      box-shadow:0 18px 40px rgba(0,63,156,.20);
      color:white;
    }

    .countdown-shell::after{
      content:"";
      position:absolute;
      width:220px;height:220px;
      right:-60px;top:-100px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(250,204,21,.34),transparent 64%);
      pointer-events:none;
    }

    .countdown-label{
      text-transform:uppercase;
      letter-spacing:.14em;
      font-size:.68rem;
      font-weight:800;
      color:rgba(255,255,255,.68);
    }

    .countdown-time{
      font-variant-numeric:tabular-nums;
      letter-spacing:-.03em;
    }

    .status-dot{
      width:10px;height:10px;border-radius:999px;
      background:var(--yellow);
      box-shadow:0 0 0 5px rgba(250,204,21,.16);
      display:inline-block;
    }

    .today-strip{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:.55rem;
    }

    .session-chip{
      border:1px solid rgba(255,255,255,.16);
      background:rgba(255,255,255,.08);
      border-radius:12px;
      padding:.55rem .7rem;
      min-width:0;
    }
    .session-chip strong{display:block;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .session-chip span{font-size:.68rem;color:rgba(255,255,255,.68);}
    .session-chip.active{background:rgba(250,204,21,.14);border-color:rgba(250,204,21,.46);}
    .session-chip.next{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.30);}
    .session-chip.off{opacity:.42;}

    .flight-trail{
      position:absolute;
      left:-12%; width:64%; height:2px; border-radius:999px;
      background:linear-gradient(90deg,transparent,rgba(0,102,255,.08),rgba(0,102,255,.42),rgba(250,204,21,.28),transparent);
      transform:rotate(-12deg); opacity:.55; animation:trailSweep 8s linear infinite;
    }
    .flight-trail:nth-child(1){top:22%;animation-delay:-1s;}
    .flight-trail:nth-child(2){top:42%;animation-delay:-4s;width:48%;opacity:.34;}
    .flight-trail:nth-child(3){top:69%;animation-delay:-2.5s;width:58%;opacity:.26;}

    .card{
      position:relative;
      overflow:hidden;
      background:var(--cardBg);
      border:1px solid rgba(11,77,166,.12);
      border-radius:20px;
      box-shadow:0 10px 28px rgba(28,61,111,.08);
      animation:cardRise .6s ease both;
      transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease;
    }
    .card::before{
      content:"";
      position:absolute;inset:0 0 auto 0;height:4px;
      background:linear-gradient(90deg,var(--blue) 0%,var(--blue) 74%,var(--yellow) 100%);
    }
    .card:hover{transform:translateY(-4px);border-color:rgba(0,102,255,.28);box-shadow:0 18px 38px rgba(0,83,195,.12);}
    .card:nth-child(1){animation-delay:.05s}.card:nth-child(2){animation-delay:.12s}.card:nth-child(3){animation-delay:.19s}.card:nth-child(4){animation-delay:.26s}

    .course-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;}
    .course-title{color:var(--ink);font-size:1.18rem;font-weight:850;line-height:1.2;}
    .course-time{
      flex:none;
      background:var(--blueSoft);
      color:var(--blue);
      border:1px solid rgba(0,102,255,.12);
      border-radius:999px;
      padding:.35rem .62rem;
      font-weight:850;
      font-size:.78rem;
      white-space:nowrap;
    }

    .meta-row{display:flex;flex-wrap:wrap;gap:.4rem .8rem;color:var(--muted);font-size:.72rem;margin-top:.7rem;}
    .meta-item{display:inline-flex;align-items:center;gap:.3rem;}
    .meta-dot{width:5px;height:5px;border-radius:99px;background:var(--yellow);}

    .today-topic{
      margin-top:1rem;
      display:grid;
      grid-template-columns:5px 1fr;
      gap:.8rem;
      align-items:stretch;
      background:linear-gradient(90deg,var(--blueSoft),#fff);
      border:1px solid rgba(0,102,255,.10);
      border-radius:14px;
      padding:.8rem .9rem;
    }
    .today-topic::before{content:"";border-radius:99px;background:linear-gradient(180deg,var(--yellow),var(--blue));}
    .today-topic-label{text-transform:uppercase;letter-spacing:.12em;font-size:.63rem;font-weight:800;color:var(--muted);}
    .today-topic-name{margin-top:.18rem;font-size:1rem;font-weight:800;color:var(--blueDeep);}

    .upcoming-box{
      margin-top:1rem;
      background:#fbfdff;
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
    }
    .upcoming-head{
      display:flex;align-items:center;justify-content:space-between;
      padding:.7rem .8rem;
      background:linear-gradient(90deg,#f4f9ff,#fffdf2);
      border-bottom:1px solid var(--line);
    }
    .upcoming-title{text-transform:uppercase;letter-spacing:.11em;font-size:.66rem;font-weight:850;color:var(--blueDeep);}
    .upcoming-count{font-size:.66rem;color:var(--muted);}
    .session-row{
      display:grid;
      grid-template-columns:116px 1fr;
      gap:.75rem;
      align-items:center;
      padding:.62rem .8rem;
      border-bottom:1px solid #edf3fb;
    }
    .session-row:last-child{border-bottom:0;}
    .session-date{font-size:.70rem;color:var(--muted);font-variant-numeric:tabular-nums;}
    .session-topic{font-size:.82rem;color:var(--ink);font-weight:650;}

    .mono{font-variant-numeric:tabular-nums;}

    .content-shell{
      width:min(100%,var(--shell-max));
      margin-inline:auto;
    }

    .schedule-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:clamp(16px,1.25vw,28px);
    }

    .schedule-meta-label{
      font-weight:800;
      color:var(--blueDeep);
    }

    @media(min-width:1600px) and (min-aspect-ratio:16/10){
      .page-shell{--shell-max:calc(100vw - (var(--shell-pad) * 2));}
      .header-panel{padding:clamp(22px,1.35vw,40px) clamp(28px,1.8vw,56px);}
      .header-grid{min-height:clamp(104px,6.4vw,154px);}
      .headline-pop{font-size:clamp(38px,2.15vw,64px)!important;}
      .headline-rule{width:clamp(300px,20vw,560px);height:5px;margin-top:1rem;}
      .today-badge{font-size:clamp(16px,.92vw,26px)!important;padding:.75em 1em;border-radius:18px;}
      .countdown-shell{padding:clamp(24px,1.4vw,42px);}
      .countdown-shell>div{grid-template-columns:minmax(0,1fr) minmax(680px,1.1fr);gap:clamp(30px,2vw,60px);}
      .countdown-label{font-size:clamp(12px,.7vw,20px);}
      #countdownClass{font-size:clamp(28px,1.55vw,46px);}
      #countdownClock{font-size:clamp(34px,1.85vw,56px);}
      #countdownSub{font-size:clamp(15px,.8vw,23px);}
      .session-chip{padding:clamp(12px,.72vw,20px) clamp(14px,.8vw,24px);border-radius:16px;}
      .session-chip strong{font-size:clamp(14px,.75vw,22px);}
      .session-chip span{font-size:clamp(12px,.64vw,18px);}
      .schedule-grid{grid-template-columns:repeat(4,minmax(0,1fr));}
      .card{padding:clamp(24px,1.35vw,40px)!important;border-radius:24px!important;}
      .course-title{font-size:clamp(24px,1.3vw,44px);}
      .course-time{font-size:clamp(13px,.7vw,24px);padding:.48em .8em;}
      .meta-row{font-size:clamp(12px,.64vw,21px);gap:.5rem 1rem;margin-top:1rem;}
      .today-topic{margin-top:1.25rem;padding:clamp(15px,.85vw,24px);}
      .today-topic-label,.upcoming-title,.upcoming-count{font-size:clamp(11px,.58vw,18px);}
      .today-topic-name{font-size:clamp(19px,1vw,34px);line-height:1.3;}
      .upcoming-box{margin-top:1.25rem;}
      .upcoming-head{padding:clamp(13px,.72vw,21px);}
      .session-row{grid-template-columns:minmax(118px,32%) 1fr;gap:clamp(12px,.75vw,22px);padding:clamp(13px,.72vw,21px);}
      .session-date{font-size:clamp(12px,.63vw,21px);}
      .session-topic{font-size:clamp(14px,.73vw,26px);line-height:1.35;}
    }

    @media(max-width:820px){
      .header-grid{grid-template-columns:1fr;justify-items:center;text-align:center;}
      .header-logo-wrap{justify-content:center;}
      .today-strip{grid-template-columns:repeat(2,minmax(0,1fr));}
    }
    @media(max-width:520px){
      .today-strip{grid-template-columns:1fr 1fr;}
      .course-head{display:block;}
      .course-time{display:inline-block;margin-top:.45rem;}
      .session-row{grid-template-columns:1fr;gap:.15rem;}
    }

    @keyframes skyBreathe{0%,100%{opacity:.72;transform:scale(1.01)}50%{opacity:1;transform:scale(1.05)}}
    @keyframes trailSweep{from{transform:translateX(-35%) rotate(-12deg)}to{transform:translateX(235%) rotate(-12deg)}}
    @keyframes cardRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}}
    ::-webkit-scrollbar{height:10px;width:10px}::-webkit-scrollbar-thumb{background:rgba(0,102,255,.18);border-radius:999px}::-webkit-scrollbar-track{background:rgba(255,255,255,.35)}
  </style>

</head>

/* =========================================

const SCHEDULE = {

  },

  Commercial: {
    days: [2,4,6], // Tue/Thu/Sat
    topics: [
      "Privileges and Limitations, Commercial Regulations",
      "MELs, Getting an MEL, Ferry Permits",
      "High Altitude Systems",
      "Constant Speed Props and Propeller Principals, Turbines",
      "Control Surfaces and Their Varieties",

      "Stalls and Spins, T-tails and Deep Stalls",
      "Effects of Wing Planform and Wing Design",
      "Critical Mach Number, Mach Tuck, Transonic Aerodynamics",

    ]
  },

  Written: {
    days: [2,3,4,5,6], // Tue/Wed/Thu/Fri/Sat
    trackByDay: {
      2: "PVT",
      3: "IRA",
      4: "PVT",
      5: "IRA",
      6: "PVT"
    },
    topics: {
      PVT: ["PVT Knowledge Test Prep"],
      IRA: ["IRA Knowledge Test Prep"]
    }
  }
};

/* =========================================
   TOPIC 1 START DATES
   These make 3/17/2026 line up as:
   Private = Runway Incursions
   Instrument = Holding Patterns
   Commercial = High Altitude Systems
   ========================================= */

const START_DATES = {
  Private: "2026-03-05",
  Instrument: "2026-02-27",
  Commercial: "2026-03-12",
  Written: "2026-03-17"
};

const CLASS_TIMES = [
  { key: "Instrument", label: "Instrument Rating", short: "Instrument", start: "10:30", end: "12:30" },
  { key: "Written", label: "Knowledge Test Prep", short: "Knowledge Prep", start: "13:00", end: "14:00" },
  { key: "Private", label: "Private", short: "Private", start: "14:00", end: "16:00" },
  { key: "Commercial", label: "Commercial", short: "Commercial", start: "16:00", end: "18:00" }
];

/* =========================================
   ENGINE
   ========================================= */

const weekdays = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const pad2 = (n) => String(n).padStart(2, "0");

function toYMD(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function formatDisplayDate(d, includeYear = false) {
  return new Intl.DateTimeFormat("en-US", {
    weekday: "short",
    month: "short",
    day: "numeric",
    ...(includeYear ? { year: "numeric" } : {})
  }).format(d);
}

function parseYMD(ymd) {
  const [y, m, d] = ymd.split("-").map(Number);
  return new Date(y, m - 1, d, 0, 0, 0, 0);
}

function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}

function isMeetingDay(days, dateObj) {
  return days.includes(dateObj.getDay());
}

function countMeetingsInclusive(anchor, target, days) {
  if (target < anchor) return 0;

  let count = 0;
  let d = new Date(anchor);

  while (d <= target) {
    if (isMeetingDay(days, d)) count++;
    d = addDays(d, 1);
  }

  return count;
}

function topicForDate(startDate, dateObj, rating) {
  if (!isMeetingDay(rating.days, dateObj)) return null;

  if (rating.trackByDay && rating.topics && !Array.isArray(rating.topics)) {
    const day = dateObj.getDay();
    const track = rating.trackByDay[day];
    const list = rating.topics[track] || [];
    if (!list.length) return null;

    const n = countMeetingsInclusive(startDate, dateObj, rating.days);
    if (n <= 0) return null;

    return list[(n - 1) % list.length];
  }

  const n = countMeetingsInclusive(startDate, dateObj, rating.days);
  const list = rating.topics || [];

  if (!list.length || n <= 0) return null;
  return list[(n - 1) % list.length];
}

function nextMeetings(fromDate, rating, howMany = 4) {
  const out = [];
  let d = new Date(fromDate);

  for (let i = 0; i < 42 && out.length < howMany; i++) {
    if (isMeetingDay(rating.days, d)) out.push(new Date(d));
    d = addDays(d, 1);
  }

  return out;
}

function meetsLabel(days) {
  return days.map(d => weekdays[d].slice(0, 3)).join(", ");
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

// Auto refresh every 2 hours (2 * 60 * 60 * 1000 ms)
setInterval(() => {
  location.reload();
}, 7200000);
/* =========================================
   UI
   ========================================= */

function pillForToday(rating, today) {
  if (isMeetingDay(rating.days, today)) {
    return `<span class="pill pill-ok text-xs px-3 py-1 rounded-full">Meets today</span>`;
  }
  return `<span class="pill text-xs px-3 py-1 rounded-full">No class today</span>`;
}

function renderCard(elId, title, timeLabel, rating, today, startDateYMD) {
  const el = document.getElementById(elId);
  const startDate = parseYMD(startDateYMD);
  const todayTopic = topicForDate(startDate, today, rating);

  const upcomingDates = nextMeetings(addDays(today, 1), rating, 4);
  const upcomingLines = upcomingDates.map(d => {
    const t = topicForDate(startDate, d, rating);
    return `
      <div class="session-row">
        <div class="session-date">${escapeHtml(formatDisplayDate(d))}</div>
        <div class="session-topic">${escapeHtml(t || "—")}</div>
      </div>
    `;
  }).join("");

  el.innerHTML = `
    <div class="course-head">
      <div class="course-title">${escapeHtml(title)}</div>
      <div class="course-time">${escapeHtml(timeLabel)}</div>
    </div>

    <div class="meta-row">
      <span class="meta-item"><span class="meta-dot"></span><span class="schedule-meta-label">Schedule</span> ${escapeHtml(meetsLabel(rating.days))}</span>
    </div>

    <div class="today-topic">
      <div>
        <div class="today-topic-label">Today</div>
        ${isMeetingDay(rating.days, today)
          ? `<div class="today-topic-name">${escapeHtml(todayTopic || "—")}</div>`
          : `<div class="today-topic-name" style="color:var(--muted)">No scheduled session</div>`}
      </div>
    </div>

    <div class="upcoming-box">
      <div class="upcoming-head">
        <div class="upcoming-title">Next sessions</div>
        <div class="upcoming-count">4 upcoming</div>
      </div>
      ${upcomingLines || `<div class="p-3 text-sm" style="color:var(--muted)">No upcoming sessions found.</div>`}
    </div>
  `;
}

function timeOnDate(dateObj, hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const d = new Date(dateObj);
  d.setHours(h, m, 0, 0);
  return d;
}

function formatClockTime(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const suffix = h >= 12 ? "PM" : "AM";
  const hour = h % 12 || 12;
  return `${hour}:${pad2(m)} ${suffix}`;
}

function formatDuration(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const hours = Math.floor(total / 3600);
  const mins = Math.floor((total % 3600) / 60);
  const secs = total % 60;
  if (hours > 0) return `${hours}h ${pad2(mins)}m ${pad2(secs)}s`;
  return `${mins}m ${pad2(secs)}s`;
}

function updateCountdown() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const sessions = CLASS_TIMES.map(item => ({
    ...item,
    rating: SCHEDULE[item.key],
    starts: timeOnDate(today, item.start),
    ends: timeOnDate(today, item.end)
  }));

  const meetingSessions = sessions.filter(s => isMeetingDay(s.rating.days, today));
  const active = meetingSessions.find(s => now >= s.starts && now < s.ends);
  const next = meetingSessions.find(s => now < s.starts);

  const eyebrow = document.getElementById("countdownEyebrow");
  const className = document.getElementById("countdownClass");
  const clock = document.getElementById("countdownClock");
  const sub = document.getElementById("countdownSub");
  const dot = document.getElementById("countdownDot");

  if (active) {
    eyebrow.textContent = "In session now";
    className.textContent = active.label;
    clock.textContent = `${formatDuration(active.ends - now)} left`;
    sub.textContent = `${formatClockTime(active.start)}–${formatClockTime(active.end)} • class is currently underway`;
    dot.style.background = "#22c55e";
    dot.style.boxShadow = "0 0 0 5px rgba(34,197,94,.16)";
  } else if (next) {
    eyebrow.textContent = "Next class today";
    className.textContent = next.label;
    clock.textContent = formatDuration(next.starts - now);
    sub.textContent = `Starts at ${formatClockTime(next.start)} • countdown updates live`;
    dot.style.background = "#facc15";
    dot.style.boxShadow = "0 0 0 5px rgba(250,204,21,.16)";
  } else if (meetingSessions.length) {
    eyebrow.textContent = "Today complete";
    className.textContent = "Ground school is finished for today";
    clock.textContent = "✓";
    sub.textContent = "All scheduled sessions for today have ended.";
    dot.style.background = "#93c5fd";
    dot.style.boxShadow = "0 0 0 5px rgba(147,197,253,.16)";
  } else {
    eyebrow.textContent = "No classes today";
    className.textContent = "No ground school sessions scheduled";
    clock.textContent = "—";
    sub.textContent = "Check the upcoming sessions below.";
  }

  const strip = document.getElementById("todayStrip");
  strip.innerHTML = sessions.map(s => {
    const meets = isMeetingDay(s.rating.days, today);
    let state = "";
    if (!meets) state = "off";
    else if (now >= s.starts && now < s.ends) state = "active";
    else if (!active && next && s.key === next.key) state = "next";
    return `<div class="session-chip ${state}"><strong>${escapeHtml(s.short)}</strong><span>${meets ? `${formatClockTime(s.start)}–${formatClockTime(s.end)}` : "No class today"}</span></div>`;
  }).join("");
}

function render() {
  const today = new Date();
  document.getElementById("todayLine").textContent = formatDisplayDate(today, true);

  renderCard("card-instrument", "Instrument Rating", "10:30 AM–12:30 PM", SCHEDULE.Instrument, today, START_DATES.Instrument);
  renderCard("card-written", "Knowledge Test Prep", "1–2 PM", SCHEDULE.Written, today, START_DATES.Written);
  renderCard("card-private", "Private", "2–4 PM", SCHEDULE.Private, today, START_DATES.Private);
  renderCard("card-commercial", "Commercial", "4–6 PM", SCHEDULE.Commercial, today, START_DATES.Commercial);
  updateCountdown();
}

render();
setInterval(updateCountdown, 1000);
</script>
